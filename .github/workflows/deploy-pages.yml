name: Deploy web game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Web build
        uses: actions/checkout@v7

      - name: Verify generated Web files
        shell: bash
        run: |
          required_files=(index.html index.js index.wasm index.pck)
          for file in "${required_files[@]}"; do
            if [[ ! -s "${file}" ]]; then
              echo "Missing or empty required Web file: ${file}" >&2
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
